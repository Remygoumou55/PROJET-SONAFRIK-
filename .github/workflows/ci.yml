name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Annule les runs en cours sur la même branche quand un nouveau commit arrive.
# Économise les minutes GitHub Actions sur les push rapides.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Remote cache Vercel Turborepo (optionnel — ignoré si les secrets ne sont pas définis)
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Le contexte `secrets` n'est pas autorisé dans un `if:` de job (→ startup_failure).
  # Ce job expose la présence des secrets en outputs, consommables via `needs` en `if:`.
  preflight:
    name: Preflight (secrets)
    runs-on: ubuntu-latest
    outputs:
      has_supabase: ${{ steps.check.outputs.has_supabase }}
      has_service_role: ${{ steps.check.outputs.has_service_role }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON" ]; then
            echo "has_supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SERVICE_ROLE" ] && [ -n "$SUPABASE_URL" ]; then
            echo "has_service_role=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_service_role=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 permet à Turbo de comparer HEAD~1 pour --affected
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Pas de `version` ici — l'action lit automatiquement package.json#packageManager
        # Source unique de vérité : "packageManager": "pnpm@11.5.2"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (API + shared)
        run: pnpm test

      - name: Probe certification (A→F)
        run: pnpm probe:certification

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-ci-build' }}
        run: pnpm build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: quality
    # Bloquant sur main — skip gracieux si SUPABASE_SERVICE_ROLE_KEY absent (setup E2E)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps
      - name: Smoke tests
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-ci-build' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm test:e2e:smoke

  e2e-publications-cert:
    name: E2E Publications Certification Gate
    runs-on: ubuntu-latest
    needs: [quality, preflight]
    # Phase 3 — Mes publications: multi-viewport + history + pagination (auth artiste requis)
    if: ${{ needs.preflight.outputs.has_supabase == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps
      - name: Publications library + certification gate
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL || 's13b-playwright-listener@sonafrik.test' }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD || 'S13BCert2026!' }}
          PUBLICATIONS_E2E_PAGE_SIZE: "10"
        run: pnpm test:e2e:publications
      - name: Publications long session stress (quick)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL || 's13b-playwright-listener@sonafrik.test' }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD || 'S13BCert2026!' }}
          PUBLICATIONS_E2E_PAGE_SIZE: "10"
        run: pnpm test:e2e:publications-stress

  finance-sandbox:
    name: Finance Sandbox E2E
    runs-on: ubuntu-latest
    needs: [quality, preflight]
    # Exécuté uniquement si les secrets Supabase sont configurés (staging linked DB)
    if: ${{ needs.preflight.outputs.has_service_role == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finance sandbox chain (topup → payout → withdrawal)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SANDBOX_FINANCE_EMAIL: ${{ secrets.SANDBOX_FINANCE_EMAIL }}
          SANDBOX_FINANCE_PASSWORD: ${{ secrets.SANDBOX_FINANCE_PASSWORD }}
        run: pnpm run:finance-sandbox-e2e
